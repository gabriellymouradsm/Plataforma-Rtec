<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma RTEC - Gestão de Resíduos e Coleta Seletiva</title>
    <meta name="description" content="Plataforma de gestão sustentável, agendamento de coleta e triagem de resíduos e e-lixo em Franco da Rocha - SP.">
    <meta name="theme-color" content="#16a34a">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/recycle.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
   
    <style>
            /* Custom EcoTrace Styles & Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(241, 245, 249, 0.8);
        }
        
        .eco-shadow {
            box-shadow: 0 4px 20px -2px rgba(22, 163, 74, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
        }
        
        .eco-gradient-header {
            background: linear-gradient(135deg, #15803d 0%, #22c55e 100%);
        }
    
    </style>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#16a34a',
                            dark: '#15803d',
                            light: '#22c55e',
                        },
                        eco: {
                            DEFAULT: '#10b981',
                        },
                        logistics: {
                            DEFAULT: '#0284c7',
                        }
                    },
                    fontFamily: {
                        heading: ['Space Grotesk', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="font-body text-slate-900 bg-slate-50 min-h-full flex flex-col antialiased selection:bg-brand-light selection:text-white">

    <!-- Top PWA App Bar / Header -->
    <header class="bg-gradient-to-r from-brand-dark to-brand-light text-white shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center font-heading font-bold text-xl">
                    ♻️
                </div>
                <div>
                    <h1 class="font-heading font-bold text-lg leading-tight">RTEC</h1>
                    <p class="text-xs text-green-100 font-medium">Franco da Rocha - SP</p>
                </div>
            </div>
            <div id="connection-status" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-100 flex items-center space-x-1 border border-emerald-400/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Online</span>
            </div>
        </div>
    </header>

    <!-- Main View Router Container -->
    <main id="app" class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        <!-- Dynamic SPA Views Will Render Here -->
    </main>

    <!-- Floating Bottom PWA Dock Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 z-40">
        <div class="max-w-md mx-auto flex items-center justify-around py-2 px-1">
            <button onclick="router.navigate('home')" class="nav-btn flex flex-col items-center p-2 text-brand font-semibold" data-route="home">
                <span class="text-xl">🏠</span>
                <span class="text-xs mt-0.5">Início</span>
            </button>
            <button onclick="router.navigate('schedule')" class="nav-btn flex flex-col items-center p-2 text-slate-500 hover:text-brand" data-route="schedule">
                <span class="text-xl">📅</span>
                <span class="text-xs mt-0.5">Agendar</span>
            </button>
            <button onclick="router.navigate('dashboard')" class="nav-btn flex flex-col items-center p-2 text-slate-500 hover:text-brand" data-route="dashboard">
                <span class="text-xl">📋</span>
                <span class="text-xs mt-0.5">Painel</span>
            </button>
            <button onclick="router.navigate('about')" class="nav-btn flex flex-col items-center p-2 text-slate-500 hover:text-brand" data-route="about">
                <span class="text-xl">ℹ️</span>
                <span class="text-xs mt-0.5">Sobre</span>
            </button>
        </div>
    </nav>

    <!-- Core App Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
