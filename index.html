<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RTEC - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://lcigujmubajgccnlyzfq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VA7m57PV0KTubn7sRyFv8g_Ttk_Ucc4';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html { font-size: 16px; transition: font-size 0.2s ease; }
    html.font-large { font-size: 19px; }
    html.font-xlarge { font-size: 22px; }
    html.daltonism-mode { filter: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><filter id="daltonism"><feColorMatrix type="matrix" values="0.35 0.7 -0.05 0 0 -0.15 1.15 0.05 0 0 0.1 0.1 0.8 0 0 0 0 0 1 0"/></filter></svg>#daltonism') contrast(120%); }

    .accessibility-bar { position: fixed; bottom: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 9999; background: rgba(0,0,0,0.75); padding: 0.5rem 0.75rem; border-radius: 2rem; backdrop-filter: blur(6px); }
    .acc-btn { background: #ffffff; border: none; border-radius: 50%; width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; color: #0f172a; font-size: 0.875rem; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.2s; }
    .acc-btn:hover { transform: scale(1.08); }

    body { width: 100%; min-height: 100vh; background-color: #ffffff; color: #0f172a; overflow-x: hidden; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }
    body.dark-mode { background-color: #0f172a; color: #f8fafc; }
    body.dark-mode .app-container { background: #0f172a; color: #f8fafc; }
    body.dark-mode header { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .logo-area { background: #1e293b; }
    body.dark-mode .auth-switcher { background: #1e293b; border-color: #334155; }
    body.dark-mode .switcher-btn { color: #94a3b8; }
    body.dark-mode .switcher-btn.active { background: #16a34a; color: #ffffff; }
    body.dark-mode main { background: #0f172a; }
    body.dark-mode .content-card { background: #1e293b; border: 1px solid #334155; box-shadow: 0 20px 45px rgba(0,0,0,0.4); color: #f8fafc; }
    body.dark-mode .content-card h2 { color: #f8fafc; }
    body.dark-mode .content-card p { color: #94a3b8; }
    body.dark-mode .user-avatar-icon { background: #0f172a; border-color: #334155; color: #4ade80; }
    body.dark-mode .input-wrapper input { background: #0f172a; border-color: #334155; color: #f8fafc; }
    body.dark-mode .input-icon { color: #94a3b8; }

    .app-container { width: 100%; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; position: relative; }
    header { background: #ffffff; width: 100%; height: 4.375rem; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; z-index: 1000; border-bottom: 1px solid #f1f5f9; }
    .logo-area { display: flex; align-items: center; gap: 0.625rem; text-decoration: none; background: #ffffff; border-radius: 1.5rem; padding: 0.25rem 0.5rem; }
    .logo-area img { height: 2.375rem; width: auto; display: block; object-fit: contain; }
    .auth-switcher { display: flex; background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.25rem; border-radius: 1.875rem; gap: 0.25rem; align-items: center; }
    .switcher-btn { background: transparent; border: none; padding: 0.5rem 1rem; border-radius: 1.5rem; font-size: 0.85rem; font-weight: 700; color: #64748b; cursor: pointer; text-decoration: none; }
    .switcher-btn.active { background: #16a34a; color: #ffffff; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3); }
    main { flex: 1; background: #16a34a; width: 100%; padding: 6rem 1rem 2.5rem 1rem; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background 0.3s; }
    body.dark-mode main { background: #0f172a; }
    .content-card { background: #ffffff; border-radius: 2rem; padding: 2.25rem 1.75rem; box-shadow: 0 20px 45px rgba(0,0,0,0.15); width: 100%; max-width: 27.5rem; text-align: center; margin-bottom: 1.5rem; }
    .user-avatar-icon { width: 4rem; height: 4rem; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #16a34a; margin: 0 auto 1rem auto; font-size: 2rem; }
    .input-group { margin-bottom: 1rem; text-align: left; }
    .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .input-wrapper input { width: 100%; height: 3.25rem; padding: 0 1rem 0 2.875rem; border: 1px solid #cbd5e1; border-radius: 0.875rem; font-size: 0.9rem; color: #0f172a; outline: none; background: #ffffff; font-weight: 500; }
    body.dark-mode .input-wrapper input { color: #f8fafc; }
    .input-icon { position: absolute; left: 1rem; color: #64748b; font-size: 1.25rem; pointer-events: none; }
    .btn-submit { width: 100%; height: 3.25rem; background: #16a34a; color: white; border: none; border-radius: 0.875rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.35); margin-top: 0.5rem; }
    .btn-submit:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <a href="sobre.html" class="logo-area">
        <img src="img/logo.png" alt="RTEC Logo">
      </a>
      <div class="auth-switcher">
        <a href="index.html" class="switcher-btn active">Login</a>
        <a href="cadastro.html" class="switcher-btn">Cadastro</a>
        <button class="switcher-btn" onclick="toggleDarkMode()" title="Modo Claro/Escuro" style="display:flex; align-items:center; justify-content:center; padding: 0.5rem;"><span class="material-symbols-outlined" id="dark-icon" style="font-size:1.125rem;">dark_mode</span></button>
      </div>
    </header>

    <main>
      <div class="content-card">
        <div class="user-avatar-icon"><span class="material-symbols-outlined" style="font-size: 2rem;">person</span></div>
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem;">Bem-vindo de volta!</h2>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem;">Entre na sua conta para continuar</p>

        <form onsubmit="fazerLoginReal(event)">
          <div class="input-group">
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">mail</span>
              <input type="email" id="login-email" placeholder="Seu E-mail" required>
            </div>
          </div>
          <div class="input-group">
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="login-senha" placeholder="Sua senha" required>
            </div>
          </div>
          <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <p style="font-size: 0.85rem; color: #64748b; margin-top: 1.25rem;">
          Não tem conta? <a href="cadastro.html" style="color: #16a34a; font-weight: 700; text-decoration: none;">Cadastrar</a>
        </p>
      </div>
    </main>
  </div>

  <div class="accessibility-bar">
    <button class="acc-btn" onclick="mudarFonte()" title="Aumentar / Reduzir Fonte">A+</button>
    <button class="acc-btn" onclick="toggleDaltonismoAPI()" title="API Filtro Daltonismo"><span class="material-symbols-outlined" style="font-size:1.125rem;">visibility</span></button>
  </div>

  <script>
    function aplicarConfiguracoesGlobais() {
      if (localStorage.getItem('rtec_dark') === 'true') {
        document.body.classList.add('dark-mode');
        const icon = document.getElementById('dark-icon');
        if (icon) icon.textContent = 'light_mode';
      }
      if (localStorage.getItem('rtec_daltonism') === 'true') {
        document.documentElement.classList.add('daltonism-mode');
      }
      const fonte = localStorage.getItem('rtec_font');
      if (fonte === 'large') document.documentElement.classList.add('font-large');
      if (fonte === 'xlarge') document.documentElement.classList.add('font-xlarge');
    }
    window.addEventListener('DOMContentLoaded', aplicarConfiguracoesGlobais);

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('rtec_dark', isDark);
      const icon = document.getElementById('dark-icon');
      if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
    }

    async function toggleDaltonismoAPI() {
      const htmlEl = document.documentElement;
      htmlEl.classList.toggle('daltonism-mode');
      const ativo = htmlEl.classList.contains('daltonism-mode');
      localStorage.setItem('rtec_daltonism', ativo);
      try {
        await fetch('https://httpbin.org/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessibilityProfile: 'daltonism', status: ativo, timestamp: Date.now() })
        });
      } catch (e) {
        console.log('API de Daltonismo sincronizada localmente.');
      }
    }

    function mudarFonte() {
      const htmlEl = document.documentElement;
      if (!htmlEl.classList.contains('font-large') && !htmlEl.classList.contains('font-xlarge')) {
        htmlEl.classList.add('font-large');
        localStorage.setItem('rtec_font', 'large');
      } else if (htmlEl.classList.contains('font-large')) {
        htmlEl.classList.remove('font-large');
        htmlEl.classList.add('font-xlarge');
        localStorage.setItem('rtec_font', 'xlarge');
      } else {
        htmlEl.classList.remove('font-xlarge');
        localStorage.setItem('rtec_font', 'normal');
      }
    }

    async function fazerLoginReal(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;

      try {
        const { data, error } = await _supabase
          .from('tbl_usuario')
          .select('*')
          .eq('email_usuario', email)
          .eq('senha_usuario', senha)
          .maybeSingle();

        if (error) throw error;
        if (!data) {
          alert('E-mail ou senha incorretos.');
          return;
        }

        localStorage.setItem('rtec_logged', 'true');
        localStorage.setItem('rtec_user_type', data.tipo_usuario || 'funcionario');
        window.location.href = 'funcionarios.html';
      } catch (err) {
        console.error("Erro no login:", err);
        alert("Erro ao validar login no banco: " + err.message);
      }
    }
  </script>
</body>
</html>
