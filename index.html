<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RTEC - Login e Gestão Sustentável</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #16a34a; min-height: 100vh; display: flex; flex-direction: column; }
    
    .app-container { width: 100%; min-height: 100vh; background: #16a34a; display: flex; flex-direction: column; position: relative; margin: 0 auto; justify-content: space-between; }

    header { background: #ffffff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; z-index: 50; width: 100%; }
    .logo-area { display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; }
    .logo-icon { width: 32px; height: 32px; background: #ecfdf5; border: 1px solid #d1fae5; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #16a34a; }
    .logo-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #16a34a; }

    .top-nav-pills { display: flex; background: #f8fafc; padding: 3px; border-radius: 20px; border: 1px solid #e2e8f0; align-items: center; gap: 2px; }
    .top-pill { padding: 6px 16px; font-size: 12px; font-weight: 600; color: #64748b; border: none; background: transparent; border-radius: 16px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .top-pill.active { background: #16a34a; color: white; font-weight: 700; box-shadow: 0 2px 4px rgba(22,163,74,0.3); }

    main { flex: 1; background: #16a34a; padding: 24px; display: flex; align-items: center; justify-content: center; width: 100%; }
    
    .auth-card { background: #ffffff; border-radius: 32px; padding: 36px 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 440px; text-align: center; }
    
    .user-avatar { width: 72px; height: 72px; background: #ecfdf5; border: 3px solid #d1fae5; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: #16a34a; }
    
    .input-icon-group { position: relative; margin-bottom: 16px; }
    .input-icon-group span.material-symbols-outlined { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 20px; }
    .input-icon-group input { width: 100%; height: 50px; padding: 0 45px 0 48px; border: 1px solid #cbd5e1; border-radius: 16px; font-size: 14px; outline: none; background: #ffffff; color: #1e293b; transition: all 0.2s; }
    .input-icon-group input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }
    
    .btn-main { width: 100%; height: 50px; background: #16a34a; color: white; border: none; border-radius: 25px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(22,163,74,0.3); margin-top: 6px; }
    .btn-main:hover { background: #15803d; }

    footer { background: #ffffff; padding: 14px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #f1f5f9; font-weight: 500; width: 100%; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <a href="index.html" class="logo-area">
        <div class="logo-icon">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">eco</span>
        </div>
        <span class="logo-text">RTEC</span>
      </a>

      <div class="top-nav-pills">
        <a href="index.html" class="top-pill active">Login</a>
        <a href="cadastro.html" class="top-pill">Cadastro</a>
      </div>

      <button style="background:none; border:none; color:#16a34a; cursor:pointer;" onclick="alert('Menu RTEC Principal')">
        <span class="material-symbols-outlined" style="font-size: 26px;">menu</span>
      </button>
    </header>

    <main>
      <div class="auth-card">
        <div class="user-avatar">
          <span class="material-symbols-outlined" style="font-size: 38px; font-variation-settings: 'FILL' 1;">person</span>
        </div>
        <h2 style="font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 6px;">Bem-vindo de volta!</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 24px;">Entre na sua conta para continuar</p>

        <form onsubmit="handleLogin(event)">
          <div class="input-icon-group">
            <span class="material-symbols-outlined">mail</span>
            <input type="email" id="login-email" required placeholder="Seu E-mail">
          </div>
          <div class="input-icon-group">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="login-pass" required placeholder="Sua senha">
            <span class="material-symbols-outlined" style="left: auto; right: 16px; cursor: pointer; color: #64748b;" onclick="togglePassword()">visibility</span>
          </div>
          <button type="submit" class="btn-main">Entrar</button>
        </form>

        <p style="font-size: 13px; color: #64748b; margin-top: 22px;">
          Não tem conta? <a href="cadastro.html" style="color: #16a34a; font-weight: 700; text-decoration: none;">Cadastrar</a>
        </p>
      </div>
    </main>

    <footer>
      Franco da Rocha & Região Metropolitana · RTEC 2026
    </footer>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      if (email) {
        window.location.href = 'agendamento.html';
      }
    }

    function togglePassword() {
      const input = document.getElementById('login-pass');
      const icon = event.target;
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
</body>
</html>
