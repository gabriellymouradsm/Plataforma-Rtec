<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RTEC - Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://lcigujmubajgccnlyzfq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VA7m57PV0KTubn7sRyFv8g_Ttk_Ucc4';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { width: 100%; min-height: 100vh; background-color: #ffffff; overflow-x: hidden; display: flex; flex-direction: column; }
    .app-container { width: 100%; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; position: relative; }
    header { background: #ffffff; width: 100%; height: 70px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; z-index: 1000; border-bottom: 1px solid #f1f5f9; }
    .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 36px; height: 36px; background: #ecfdf5; border: 1px solid #d1fae5; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #16a34a; font-size: 18px; }
    .logo-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; color: #16a34a; letter-spacing: -0.5px; }
    .auth-switcher { display: flex; background: #f8fafc; border: 1px solid #e2e8f0; padding: 4px; border-radius: 30px; gap: 4px; }
    .switcher-btn { background: transparent; border: none; padding: 8px 20px; border-radius: 24px; font-size: 13.5px; font-weight: 700; color: #64748b; cursor: pointer; text-decoration: none; }
    .switcher-btn.active { background: #16a34a; color: #ffffff; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3); }
    main { flex: 1; background: #16a34a; width: 100%; padding: 96px 16px 40px 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .content-card { background: #ffffff; border-radius: 32px; padding: 36px 28px; box-shadow: 0 20px 45px rgba(0,0,0,0.15); width: 100%; max-width: 440px; text-align: center; margin-bottom: 24px; }
    .user-avatar-icon { width: 64px; height: 64px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #16a34a; margin: 0 auto 16px auto; font-size: 32px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .input-wrapper input { width: 100%; height: 52px; padding: 0 16px 0 46px; border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; color: #0f172a; outline: none; background: #ffffff; font-weight: 500; }
    .input-icon { position: absolute; left: 16px; color: #64748b; font-size: 20px; pointer-events: none; }
    .btn-submit { width: 100%; height: 52px; background: #16a34a; color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.35); margin-top: 8px; }
    .btn-submit:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <a href="index.html" class="logo-area">
        <div class="logo-icon"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">eco</span></div>
        <span class="logo-text">RTEC</span>
      </a>
      <div class="auth-switcher">
        <a href="index.html" class="switcher-btn">Login</a>
        <a href="cadastro.html" class="switcher-btn active">Cadastro</a>
      </div>
    </header>

    <main>
      <div class="content-card">
        <div class="user-avatar-icon"><span class="material-symbols-outlined" style="font-size: 32px;">person_add</span></div>
        <h2 style="font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 4px;">Crie sua Conta</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 24px;">Preencha os dados para começar</p>

        <form onsubmit="fazerCadastroReal(event)">
          <div class="input-group">
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">badge</span>
              <input type="text" id="cad-nome" placeholder="Nome" required>
            </div>
          </div>
          <div class="input-group">
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">badge</span>
              <input type="text" id="cad-sobrenome" placeholder="Sobrenome" required>
            </div>
          </div>
          <div class="input-group">
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">mail</span>
              <input type="email" id="cad-email" placeholder="Seu E-mail" required>
            </div>
          </div>
          <div class="input-group">
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="cad-senha" placeholder="Crie uma senha" required>
            </div>
          </div>
          <button type="submit" class="btn-submit">Cadastrar</button>
        </form>

        <p style="font-size: 13px; color: #64748b; margin-top: 20px;">
          Já tem uma conta? <a href="index.html" style="color: #16a34a; font-weight: 700; text-decoration: none;">Faça login</a>
        </p>
      </div>
    </main>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <script>
    async function fazerCadastroReal(event) {
      event.preventDefault();
      const nome = document.getElementById('cad-nome').value;
      const sobrenome = document.getElementById('cad-sobrenome').value;
      const email = document.getElementById('cad-email').value;
      const senha = document.getElementById('cad-senha').value;

      try {
        const { error } = await _supabase.from('tbl_usuario').insert([
          {
            nome_usuario: nome,
            sobrenome_usuario: sobrenome,
            email_usuario: email,
            senha_usuario: senha, 
            tipo_usuario: 'funcionario'
          }
        ]);

        if (error) throw error;

        alert('Cadastro realizado com sucesso!');
        window.location.href = 'index.html';
      } catch (err) {
        console.error("Erro no cadastro:", err);
        alert("Erro ao cadastrar usuário: " + err.message);
      }
    }
  </script>
</body>
</html>
